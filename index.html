<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Калькулятор</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .calculator {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      width: 320px;
    }
    .display {
      background: #000;
      color: #0f0;
      font-size: 32px;
      font-weight: bold;
      padding: 15px;
      border-radius: 8px;
      height: 50px;
      text-align: right;
      margin-bottom: 15px;
      user-select: none;
      overflow-x: auto;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      padding: 20px 0;
      font-size: 24px;
      background: #333;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
      user-select: none;
    }
    button:hover {
      background: #555;
    }
    button.operator {
      background: #ff9500;
      color: #fff;
    }
    button.operator:hover {
      background: #e08900;
    }
    button.equal {
      background: #0a84ff;
      grid-column: span 2;
      color: #fff;
    }
    button.equal:hover {
      background: #006ce0;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>
    <div class="buttons">
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="operator" onclick="press('/')">÷</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="operator" onclick="press('*')">×</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="operator" onclick="press('-')">−</button>

      <button onclick="press('0')">0</button>
      <button onclick="clearDisplay()">C</button>
      <button class="equal" onclick="calculate()">=</button>
      <button class="operator" onclick="press('+')">+</button>
    </div>
  </div>

  <script>
    let expression = '';

    function press(char) {
      // Запрещаем ввод операторов подряд
      const lastChar = expression.slice(-1);
      if ('+-*/'.includes(char)) {
        if (expression === '' || '+-*/'.includes(lastChar)) {
          // Не добавляем оператор если он первый или если предыдущий тоже оператор
          return;
        }
      }

      expression += char;
      updateDisplay();
    }

    function updateDisplay() {
      const display = document.getElementById('display');
      display.textContent = expression || '0';
    }

    function clearDisplay() {
      expression = '';
      updateDisplay();
    }

    function calculate() {
      // Проверим, что выражение не пустое и не заканчивается на оператор
      if (expression === '' || '+-*/'.includes(expression.slice(-1))) {
        return;
      }

      try {
        // eslint-disable-next-line no-eval
        const result = eval(expression);
        expression = String(result);
        updateDisplay();
      } catch (e) {
        expression = '';
        document.getElementById('display').textContent = 'Ошибка!';
      }
    }

    // Инициализация дисплея
    updateDisplay();
  </script>
</body>
</html>
