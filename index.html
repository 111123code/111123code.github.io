<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Простой калькулятор</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 350px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    input[type="number"] {
      width: 100px;
      padding: 8px;
      font-size: 16px;
      margin-right: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #007bff;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <h1>Простой калькулятор</h1>

  <input type="number" id="num1" placeholder="Число 1" />
  <input type="number" id="num2" placeholder="Число 2" />
  <br/>

  <button onclick="calculate('+')">+</button>
  <button onclick="calculate('-')">−</button>
  <button onclick="calculate('*')">×</button>
  <button onclick="calculate('/')">÷</button>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
